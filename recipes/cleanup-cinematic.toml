# Clean-up and cinematic grade: blemishes, teal & orange, darker background, vignette.
# PhotoCraft prepares a 16-bit TIFF, then LightCraft retouches and grades with masks.
# Originals are never touched; each stage writes into its own folder of the run.

[[stage]]
app = "photocraft"
out_ext = "tif"
# Pixel work goes here (object removal, cut-outs). This recipe only converts.
steps = []

[[stage]]
app = "lightcraft"
steps = [
  # Skin blemishes on every face (needs LightCraft's YuNet face detector; skipped without it).
  { cmd = "spot.findBlemishes", params = { sensitivity = 45, maxPerFace = 6 }, optional = "blemishes" },
  # Teal shadows, warm highlights, a little contrast and crushed blacks.
  { cmd = "develop.set", params = { values = { "light.contrast" = 15, "light.blacks" = -12, "light.highlights" = -20, "grading.shadows.hue" = 200, "grading.shadows.sat" = 18, "grading.highlights.hue" = 40, "grading.highlights.sat" = 14, "grading.balance" = -10, "color.saturation" = -8, "vignette.amount" = -18 } } },
  # Background a bit darker and cooler, so the subject stands out (needs SAM 3).
  { cmd = "mask.add", params = { kind = "background", name = "Cinematic background" }, optional = "background" },
  { cmd = "mask.adjust", params = { values = { exposure = -0.35, temp = -8, clarity = -10 } }, optional = "background" },
]
export = { format = "jpg", quality = 92 }
