[package]
name = "kimera"
version = "0.1.0"
edition = "2024"
description = "Kimera: a CLI tool for Craft apps (LightCraft, PhotoCraft, VectorCraft)"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
